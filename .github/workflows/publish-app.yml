name: Build and publish Android App

on:
  push:
    branches:
      - "feature/**"
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [debug, test, stable]
        default: test
        required: true

permissions:
  contents: read

concurrency:
  group: app-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APP_RELEASE_BASE_URL: ${{ secrets.APP_RELEASE_BASE_URL }}
      APP_RELEASE_UPLOAD_TOKEN: ${{ secrets.APP_RELEASE_UPLOAD_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore distribution keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force -Path .local-tools/signing | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $PWD '.local-tools/signing/robot-release.jks'),
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )
          "ANDROID_KEYSTORE_FILE=.local-tools/signing/robot-release.jks" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Select version and channel
        id: release
        shell: pwsh
        run: |
          $versionCode = 100000 + [int]$env:GITHUB_RUN_NUMBER
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $channel = 'test'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $channel = 'stable' }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $channel = '${{ inputs.channel }}' }
          $versionName = "1.3.$env:GITHUB_RUN_NUMBER-$channel+$shortSha"
          "version_code=$versionCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version_name=$versionName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test and build signed APK
        shell: pwsh
        run: |
          $task = if ('${{ steps.release.outputs.channel }}' -eq 'debug') { 'assembleDebug' } else { 'assembleRelease' }
          ./tools/run-gradle.ps1 testDebugUnitTest lintDebug $task `
            "-Papp.version.code=${{ steps.release.outputs.version_code }}" `
            "-Papp.version.name=${{ steps.release.outputs.version_name }}" `
            "-Papp.update.channel=${{ steps.release.outputs.channel }}" `
            "-Papp.git.commit=${{ github.sha }}"

      - name: Publish APK to cloud channel
        shell: pwsh
        run: |
          $apkName = if ('${{ steps.release.outputs.channel }}' -eq 'debug') { 'app/build/outputs/apk/debug/app-debug.apk' } else { 'app/build/outputs/apk/release/app-release.apk' }
          $apk = Resolve-Path $apkName
          $sha = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $base = $env:APP_RELEASE_BASE_URL.TrimEnd('/')
          $query = [Uri]::EscapeDataString('${{ steps.release.outputs.version_name }}')
          $uri = "$base/api/app-releases/upload?channel=${{ steps.release.outputs.channel }}&versionCode=${{ steps.release.outputs.version_code }}&versionName=$query&gitCommit=$env:GITHUB_SHA"
          Invoke-RestMethod -Method Post -Uri $uri -InFile $apk `
            -ContentType 'application/vnd.android.package-archive' `
            -Headers @{ Authorization = "Bearer $env:APP_RELEASE_UPLOAD_TOKEN"; 'X-APK-SHA256' = $sha }

      - uses: actions/upload-artifact@v4
        with:
          name: solar-robot-${{ steps.release.outputs.channel }}-${{ steps.release.outputs.version_code }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
